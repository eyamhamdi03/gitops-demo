<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitOps Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #052e16;
      color: #f0fdf4;
    }
    .card {
      text-align: center;
      padding: 40px 48px;
      border-radius: 12px;
      background: #14532d;
      max-width: 560px;
    }
    h1 {
      margin-top: 0;
      color: #4ade80;
    }
    .version {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-weight: bold;
    }
    ul {
      text-align: left;
      margin: 24px auto 0;
      padding-left: 20px;
      max-width: 380px;
      line-height: 1.6;
    }
    .flow {
      margin-top: 24px;
      font-size: 14px;
      color: #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GitOps Demo</h1>
    <p>Application deployed with Kubernetes and ArgoCD</p>
    <span class="version">Version: v2</span>
    <ul>
      <li>Built automatically by GitHub Actions</li>
      <li>Synced to the cluster by ArgoCD</li>
      <li>Rollback with a simple <code>git revert</code></li>
    </ul>
    <p class="flow">Git &rarr; GitHub Actions &rarr; ArgoCD &rarr; Kubernetes</p>
  </div>
</body>
</html>
