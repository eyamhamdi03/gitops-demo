<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitOps Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #1e293b;
      color: #f1f5f9;
    }
    .card {
      text-align: center;
      padding: 40px 48px;
      border-radius: 12px;
      background: #334155;
      max-width: 520px;
    }
    h1 {
      margin-top: 0;
      color: #38bdf8;
    }
    .version {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #0ea5e9;
      color: #0f172a;
      font-weight: bold;
    }
    .flow {
      margin-top: 24px;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>GitOps Demo</h1>
    <p>Application deployed with Kubernetes and ArgoCD</p>
    <span class="version">Version: v1</span>
    <p class="flow">Git &rarr; ArgoCD &rarr; Kubernetes</p>
  </div>
</body>
</html>
